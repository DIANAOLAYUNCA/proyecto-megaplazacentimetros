spring.application.name=proyecto-megacentro
server.port=8080

# Base de datos: crearla antes con src/main/resources/db/bd_plaza_megacentimetros.sql
spring.datasource.url=jdbc:mysql://localhost:3306/bd_plaza_megacentimetros?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# El script SQL es la fuente de verdad: Hibernate no modifica el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
